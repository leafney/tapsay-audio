name: Package Architecture

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      signing_mode:
        required: true
        type: string
      metadata_mode:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ""
    secrets:
      DEVELOPER_ID_APPLICATION_P12_BASE64:
        required: false
      DEVELOPER_ID_APPLICATION_P12_PASSWORD:
        required: false
      DEVELOPER_ID_INSTALLER_P12_BASE64:
        required: false
      DEVELOPER_ID_INSTALLER_P12_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64:
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build inputs and runner
        env:
          INPUT_ARCHITECTURE: ${{ inputs.architecture }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_SIGNING_MODE: ${{ inputs.signing_mode }}
          INPUT_METADATA_MODE: ${{ inputs.metadata_mode }}
        run: |
          set -euo pipefail
          case "$INPUT_ARCHITECTURE" in
            arm64|x86_64) ;;
            *) echo "Unsupported architecture: $INPUT_ARCHITECTURE" >&2; exit 1 ;;
          esac
          [[ "$(uname -m)" == "$INPUT_ARCHITECTURE" ]]
          [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          case "$INPUT_SIGNING_MODE" in
            adhoc|developer-id) ;;
            *) echo "Unsupported signing mode: $INPUT_SIGNING_MODE" >&2; exit 1 ;;
          esac
          case "$INPUT_METADATA_MODE" in
            manual|tag) ;;
            *) echo "Unsupported metadata mode: $INPUT_METADATA_MODE" >&2; exit 1 ;;
          esac

      - name: Validate Developer ID secrets
        if: inputs.signing_mode == 'developer-id'
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            "$DEVELOPER_ID_APPLICATION_P12_BASE64" \
            "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            "$DEVELOPER_ID_INSTALLER_P12_BASE64" \
            "$DEVELOPER_ID_INSTALLER_P12_PASSWORD" \
            "$APPLE_TEAM_ID" \
            "$APP_STORE_CONNECT_ISSUER_ID" \
            "$APP_STORE_CONNECT_KEY_ID" \
            "$APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64"; do
            if [[ -z "$value" ]]; then
              echo "Developer ID signing requires all configured secrets" >&2
              exit 1
            fi
          done

      - name: Import Developer ID credentials
        id: signing
        if: inputs.signing_mode == 'developer-id'
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/tapsay-signing.keychain-db"
          application_certificate="$RUNNER_TEMP/developer-id-application.p12"
          installer_certificate="$RUNNER_TEMP/developer-id-installer.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          keychain_secret="$(openssl rand -hex 32)"

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$application_certificate"
          printf '%s' "$DEVELOPER_ID_INSTALLER_P12_BASE64" | base64 --decode > "$installer_certificate"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$application_certificate" "$installer_certificate" "$api_key_path"

          security create-keychain -p "$keychain_secret" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_secret" "$keychain_path"
          security import "$application_certificate" -k "$keychain_path" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security import "$installer_certificate" -k "$keychain_path" \
            -P "$DEVELOPER_ID_INSTALLER_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_secret" "$keychain_path"

          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          read -r -a keychains <<< "$existing_keychains"
          security list-keychains -d user -s "$keychain_path" "${keychains[@]}"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          application_identity="$(printf '%s\n' "$identity_output" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          installer_identity="$(printf '%s\n' "$identity_output" \
            | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$application_identity" || -z "$installer_identity" ]]; then
            echo "A required Developer ID identity was not imported" >&2
            exit 1
          fi

          printf 'application_identity=%s\n' "$application_identity" >> "$GITHUB_OUTPUT"
          printf 'installer_identity=%s\n' "$installer_identity" >> "$GITHUB_OUTPUT"
          printf 'keychain_path=%s\n' "$keychain_path" >> "$GITHUB_OUTPUT"
          printf 'api_key_path=%s\n' "$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Prepare effective product metadata
        env:
          INPUT_ARCHITECTURE: ${{ inputs.architecture }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_METADATA_MODE: ${{ inputs.metadata_mode }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python3 scripts/prepare-build-metadata.py \
            --mode "$INPUT_METADATA_MODE" \
            --tag "$INPUT_TAG" \
            --build-number "$INPUT_BUILD_NUMBER" \
            --config config/product.json \
            --output-json .build/build-metadata.json
          effective_version="$(plutil -extract product.version raw -o - config/product.json)"
          effective_build="$(plutil -extract product.build_number raw -o - config/product.json)"
          [[ "$effective_version" == "$INPUT_VERSION" ]]
          [[ "$effective_build" == "$INPUT_BUILD_NUMBER" ]]
          python3 scripts/check-metadata.py
          python3 Tests/ReleaseToolsTests.py
          python3 Tests/DriverSourceTests.py
          python3 - "$INPUT_ARCHITECTURE" config/product.json <<'PY'
          import json
          import sys
          architecture, config = sys.argv[1:]
          data = json.load(open(config, encoding="utf-8"))
          if architecture not in data["product"]["architectures"]:
              raise SystemExit("Architecture is not enabled in product.json")
          PY

      - name: Build and verify architecture package
        env:
          INPUT_ARCHITECTURE: ${{ inputs.architecture }}
          INPUT_SIGNING_MODE: ${{ inputs.signing_mode }}
          DEVELOPER_ID_APPLICATION_IDENTITY: ${{ steps.signing.outputs.application_identity }}
          DEVELOPER_ID_INSTALLER_IDENTITY: ${{ steps.signing.outputs.installer_identity }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tapsay-audio-artifact"
          bash scripts/build-packages.sh \
            --arch "$INPUT_ARCHITECTURE" \
            --output "$output" \
            --signing-mode "$INPUT_SIGNING_MODE"

      - name: Remove Developer ID credentials
        if: always() && inputs.signing_mode == 'developer-id'
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/tapsay-signing.keychain-db
        run: |
          set -euo pipefail
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP/developer-id-installer.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapSayAudio-2ch-${{ inputs.version }}-${{ inputs.architecture }}-build-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/tapsay-audio-artifact/*.dmg
            ${{ runner.temp }}/tapsay-audio-artifact/*.pkg
            ${{ runner.temp }}/tapsay-audio-artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
