name: Publish Pre-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tapsay-audio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              tag,
          )
          if match is None:
              raise SystemExit("Release tag must strictly match vX.Y.Z")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + tag[1:] + "\n")
          PY

  arm64:
    needs: prepare
    uses: ./.github/workflows/package-arch.yml
    secrets: inherit
    with:
      architecture: arm64
      runner: macos-15
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ github.run_number }}
      signing_mode: developer-id
      metadata_mode: tag
      tag: ${{ github.ref_name }}

  x86_64:
    needs: prepare
    uses: ./.github/workflows/package-arch.yml
    secrets: inherit
    with:
      architecture: x86_64
      runner: macos-15-intel
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ github.run_number }}
      signing_mode: developer-id
      metadata_mode: tag
      tag: ${{ github.ref_name }}

  publish:
    needs:
      - prepare
      - arm64
      - x86_64
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: TapSayAudio-2ch-${{ needs.prepare.outputs.version }}-arm64-build-${{ github.run_number }}
          path: ${{ runner.temp }}/release-input/arm64

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: TapSayAudio-2ch-${{ needs.prepare.outputs.version }}-x86_64-build-${{ github.run_number }}
          path: ${{ runner.temp }}/release-input/x86_64

      - name: Prepare build provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python3 scripts/prepare-build-metadata.py \
            --mode tag \
            --tag "$RELEASE_TAG" \
            --build-number "${{ github.run_number }}" \
            --config config/product.json \
            --output-json .build/build-metadata.json

      - name: Assemble and verify public release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/assemble-release.py \
            --arm64-dir "$RUNNER_TEMP/release-input/arm64" \
            --x86_64-dir "$RUNNER_TEMP/release-input/x86_64" \
            --output "$RUNNER_TEMP/public-release" \
            --version "$RELEASE_VERSION" \
            --minimum-macos 14.0 \
            --build-metadata .build/build-metadata.json

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "TapSay Audio $RELEASE_VERSION" \
            --generate-notes \
            "$RUNNER_TEMP/public-release/TapSayAudio-2ch-${RELEASE_VERSION}-arm64.dmg" \
            "$RUNNER_TEMP/public-release/TapSayAudio-2ch-${RELEASE_VERSION}-x86_64.dmg" \
            "$RUNNER_TEMP/public-release/TapSayAudio-2ch-${RELEASE_VERSION}-source.tar.gz" \
            "$RUNNER_TEMP/public-release/SHA256SUMS.txt"
