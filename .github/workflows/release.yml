name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tapsay-audio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    outputs:
      version: ${{ steps.tag.outputs.version }}
      signing_mode: ${{ steps.signing.outputs.signing_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select signing mode
        id: signing
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
        run: python3 scripts/release-signing-mode.py

      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              tag,
          )
          if match is None:
              raise SystemExit("Release tag must strictly match vX.Y.Z")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + tag[1:] + "\n")
          PY

  arm64:
    needs: prepare
    uses: ./.github/workflows/package-arch.yml
    secrets: inherit
    with:
      architecture: arm64
      runner: macos-15
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ github.run_number }}
      signing_mode: ${{ needs.prepare.outputs.signing_mode }}
      metadata_mode: tag
      tag: ${{ github.ref_name }}

  x86_64:
    needs: prepare
    uses: ./.github/workflows/package-arch.yml
    secrets: inherit
    with:
      architecture: x86_64
      runner: macos-15-intel
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ github.run_number }}
      signing_mode: ${{ needs.prepare.outputs.signing_mode }}
      metadata_mode: tag
      tag: ${{ github.ref_name }}

  publish:
    needs:
      - prepare
      - arm64
      - x86_64
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: TapSayAudio-2ch-${{ needs.prepare.outputs.version }}-arm64-build-${{ github.run_number }}
          path: ${{ runner.temp }}/release-input/arm64

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: TapSayAudio-2ch-${{ needs.prepare.outputs.version }}-amd64-build-${{ github.run_number }}
          path: ${{ runner.temp }}/release-input/x86_64

      - name: Prepare build provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python3 scripts/prepare-build-metadata.py \
            --mode tag \
            --tag "$RELEASE_TAG" \
            --build-number "${{ github.run_number }}" \
            --config config/product.json \
            --output-json .build/build-metadata.json

      - name: Assemble and verify public release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/assemble-release.py \
            --arm64-dir "$RUNNER_TEMP/release-input/arm64" \
            --x86_64-dir "$RUNNER_TEMP/release-input/x86_64" \
            --output "$RUNNER_TEMP/public-release" \
            --version "$RELEASE_VERSION" \
            --build-metadata .build/build-metadata.json \
            --signing-mode "${{ needs.prepare.outputs.signing_mode }}" \
            --formal

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/publish-github-release.py \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --signing-mode "${{ needs.prepare.outputs.signing_mode }}" \
            --directory "$RUNNER_TEMP/public-release"
